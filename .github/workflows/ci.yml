name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - name: Linter
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Build
        run: npm run build
